<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support | Reporting Validator</title>
    <style>
      :root {
        --bg: #f5f8fc;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #dbe4ef;
        --text: #0f172a;
        --text-muted: #475569;
        --primary: #1d4ed8;
        --primary-strong: #1e40af;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px 16px 32px;
        color: var(--text);
        background: var(--bg);
      }

      .support-shell {
        max-width: 520px;
        margin: 0 auto;
        min-height: calc(100vh - 52px);
        display: flex;
        flex-direction: column;
      }

      .support-content {
        margin-top: 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px;
        font-size: 13px;
        line-height: 1.55;
      }

      .support-content h2,
      .support-content h3 {
        margin: 18px 0 10px;
        letter-spacing: -0.01em;
      }

      .support-content h2:first-child,
      .support-content h3:first-child,
      .support-content p:first-child,
      .support-content ul:first-child,
      .support-content ol:first-child {
        margin-top: 0;
      }

      .support-content h2 {
        font-size: 18px;
      }

      .support-content h3 {
        font-size: 15px;
      }

      .support-content p {
        margin: 10px 0;
      }

      .support-content hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 16px 0;
      }

      .support-content ul,
      .support-content ol {
        margin: 10px 0;
        padding-left: 20px;
      }

      .support-content li + li {
        margin-top: 6px;
      }

      .support-content strong {
        font-weight: 600;
      }

      .support-actions {
        margin-top: auto;
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }

      .support-back {
        display: block;
        width: 80%;
        max-width: 220px;
        padding: 9px 10px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #ffffff;
        text-decoration: none;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }

      .support-back:hover {
        background: var(--primary-strong);
      }
    </style>
  </head>
  <body>
    <div class="support-shell">
      <div id="supportContent" class="support-content" aria-live="polite">Loading support details...</div>

      <div class="support-actions">
        <a class="support-back" href="./taskpane.html">Back</a>
      </div>
    </div>

    <script>
      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatInlineMarkdown(text) {
        const escaped = escapeHtml(text);
        return escaped
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>");
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let listType = null;

        const closeList = () => {
          if (listType) {
            html.push(listType === "ol" ? "</ol>" : "</ul>");
            listType = null;
          }
        };

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();
          const trimmed = line.trim();

          if (!trimmed) {
            closeList();
            continue;
          }

          if (/^---+$/.test(trimmed)) {
            closeList();
            html.push("<hr />");
            continue;
          }

          const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length + 1;
            html.push(`<h${level}>${formatInlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          const unordered = trimmed.match(/^[*-]\s+(.+)$/);
          if (unordered) {
            if (listType !== "ul") {
              closeList();
              html.push("<ul>");
              listType = "ul";
            }
            html.push(`<li>${formatInlineMarkdown(unordered[1])}</li>`);
            continue;
          }

          const ordered = trimmed.match(/^\d+\.\s+(.+)$/);
          if (ordered) {
            if (listType !== "ol") {
              closeList();
              html.push("<ol>");
              listType = "ol";
            }
            html.push(`<li>${formatInlineMarkdown(ordered[1])}</li>`);
            continue;
          }

          closeList();
          html.push(`<p>${formatInlineMarkdown(trimmed)}</p>`);
        }

        closeList();
        return html.join("");
      }

      async function loadSupportContent() {
        const container = document.getElementById("supportContent");
        try {
          const response = await fetch("./support.md", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Failed to load support.md (${response.status})`);
          }

          const markdown = await response.text();
          container.innerHTML = renderMarkdown(markdown);
        } catch (error) {
          container.textContent = "Support details are unavailable right now.";
          console.error("[Support page]", error);
        }
      }

      loadSupportContent();
    </script>
  </body>
</html>
