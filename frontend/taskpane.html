<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Validator</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="./config.js"></script>
    <!-- D3 and Sankey for client-side Sankey generation -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
      :root {
        --bg: #f5f8fc;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #dbe4ef;
        --text: #0f172a;
        --text-muted: #475569;
        --primary: #1d4ed8;
        --primary-strong: #1e40af;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        --panel-max-width: 960px;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px 14px 64px;
        color: var(--text);
        background: linear-gradient(180deg, #f7faff 0%, #f4f8fc 100%);
      }

      .app-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px;
        box-sizing: border-box;
        width: min(100%, var(--panel-max-width));
        margin: 0 auto;
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-header img {
        width: 28px;
        height: 28px;
        object-fit: contain;
        border-radius: 6px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }

      .hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .tabs {
        display: flex;
        width: 96%;
        gap: 6px;
        margin-top: 14px;
        padding: 4px;
        border-radius: 10px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
      }

      .tab-button {
        flex: 1;
        width: auto;
        margin-top: 0;
        padding: 7px 12px;
        background: transparent;
        color: var(--text-muted);
        border: none;
        border-radius: 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .tab-button[aria-selected="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      input, textarea, select, button {
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 13px;
      }

      select,
      textarea,
      input {
        background: #fff;
        color: var(--text);
      }

      select:focus,
      textarea:focus,
      input:focus,
      button:focus-visible,
      .tab-button:focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.4);
        outline-offset: 1px;
      }

      textarea {
        min-height: 170px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.45;
        resize: none;
      }

      button {
        background: var(--primary);
        color: #fff;
        border: 1px solid var(--primary);
        cursor: pointer;
        font-weight: 600;
      }

      button:hover:not(:disabled) {
        background: var(--primary-strong);
      }

      button:disabled {
        background: #cbd5e1;
        border-color: #cbd5e1;
        color: #64748b;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #f8fafc;
        border-color: var(--border);
        color: #1e293b;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #eef2f7;
      }

      .tab-panel {
        display: none;
        margin-top: 12px;
      }
      .tab-panel.active { display: block; }

      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .actions-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        min-height: 34px;
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(calc(100% - 50px), 900px);
        z-index: 100;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.1);
      }

      .section-title {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal.active {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 14px 0 0;
      }

      .modal-content {
        background-color: var(--surface);
        padding: 20px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        box-sizing: border-box;
        width: min(calc(100vw - 28px), var(--panel-max-width));
        max-width: var(--panel-max-width);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 16px;
      }

      .close-modal {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        width: auto;
        padding: 0;
        margin: 0;
        color: var(--text-muted);
      }

      .close-modal:hover:not(:disabled) {
        background: none;
        color: var(--text-muted);
      }

      .exception-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }

      .exception-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        padding: 10px;
        background: var(--surface-muted);
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      .exception-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .exception-id {
        font-weight: 600;
        font-size: 13px;
      }

      .exception-desc {
        font-size: 12px;
        color: var(--text-muted);
      }

      .exception-status {
        display: inline-block;
        width: fit-content;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        background: #e0e7ff;
        color: #3730a3;
      }

      .exception-actions {
        display: flex;
        gap: 4px;
      }

      .icon-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 6px 8px !important;
        width: auto;
        margin: 0;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        color: var(--text);
      }

      .icon-btn:hover {
        background: var(--border);
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        margin-top: 0;
        display: block;
        margin-bottom: 4px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        margin-top: 0;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      .modal-actions button {
        margin-top: 0;
      }

      #exceptionSelect {
        margin-bottom: 10px;
      }

      #exceptionDescriptionInput {
        resize: none;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="brand-header">
        <img src="./AXIOS.png" alt="Axios logo" />
        <h2>Bordereaux Validator</h2>
      </div>
      <div class="hint">Identify data issues faster with intelligent bordereaux validation and reporting.</div>

      <div class="tabs" role="tablist" aria-label="Validator sections">
        <button id="tabConfiguration" class="tab-button" role="tab" aria-selected="true" aria-controls="panelConfiguration">Configure</button>
        <button id="tabControl" class="tab-button" role="tab" aria-selected="false" aria-controls="panelControl">Control</button>
        <button id="tabAnalysis" class="tab-button" role="tab" aria-selected="false" aria-controls="panelAnalysis">Analyse</button>
      </div>

      <section id="panelConfiguration" class="tab-panel active panel-card" role="tabpanel" aria-labelledby="tabConfiguration">
        <label for="testPacks">Test Pack</label>
        <select id="testPacks">
          <option value="">Loading subscribed packs...</option>
        </select>

        <div id="territoryGroup">
          <label for="territory">Territory</label>
          <select id="territory"></select>
        </div>

        <button id="generateTemplate" class="btn-secondary">Generate Template</button>

        <label for="packConfigs">Validation Configuration</label>
        <textarea id="packConfigs"></textarea>
      </section>

      <section id="panelControl" class="tab-panel panel-card" role="tabpanel" aria-labelledby="tabControl">
        <div class="actions-grid">
          <button id="runValidation">Validate</button>
          <button id="clearTable" class="btn-secondary">Clear</button>
        </div>
        
        <div class="section-title">Exception Management</div>
        <select id="exceptionSelect">
          <option value="">No exceptions available</option>
        </select>
        
        <div class="actions-grid">
          <button id="applyException" class="btn-secondary">Apply Exception</button>
          <button id="manageExceptions" class="btn-secondary">Manage Exceptions</button>
        </div>
      </section>

      <section id="panelAnalysis" class="tab-panel panel-card" role="tabpanel" aria-labelledby="tabAnalysis">
        <div class="actions-grid">
          <button id="visualiseResults" class="btn-secondary">Visualise</button>
          <button id="rulesEngine" class="btn-secondary">Rules Engine</button>
          <button id="extractResults" class="btn-secondary">Extract</button>
          <label for="savedVersions">Report Management</label>
          <select id="savedVersions">
            <option value="">No saved reports</option>
          </select>
          <button id="saveResultsVersion" class="btn-secondary">Save Report</button>
          <button id="deleteResultsVersion" class="btn-secondary">Delete Report</button>
        </div>
      </section>

      <div class="status" id="status"></div>
    </div>

    <!-- Exception Management Modal -->
    <div id="exceptionModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Manage Exceptions</h3>
          <button class="close-modal" onclick="closeExceptionModal()">&times;</button>
        </div>

        <div id="exceptionListContainer" style="display: none;">
          <h4 style="margin: 0 0 12px 0; font-size: 14px;">Existing Exceptions</h4>
          <div id="exceptionList" class="exception-list"></div>
        </div>

        <div id="noExceptionsMessage" style="text-align: center; color: var(--text-muted); padding: 20px;">
          No existing exceptions
        </div>

        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
          <h4 id="exceptionFormTitle" style="margin: 0 0 12px 0; font-size: 14px;">Create New Exception</h4>
          <div class="form-group">
            <label for="exceptionIdInput">Exception ID *</label>
            <input type="text" id="exceptionIdInput" placeholder=" Example: EXC-001" />
          </div>
          <div class="form-group">
            <label for="exceptionFieldInput">Linked Field (Optional)</label>
            <select id="exceptionFieldInput">
              <option value="">Select a field...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="exceptionUmrInput">Linked UMR (Optional)</label>
            <input type="text" id="exceptionUmrInput" placeholder="Example: POL-100" />
          </div>
          <div class="form-group">
            <label for="exceptionDescriptionInput">Description *</label>
            <textarea id="exceptionDescriptionInput" placeholder="Describe the exception..." style="min-height: 80px;"></textarea>
          </div>
          <div class="form-group">
            <label for="exceptionStatusInput">Status</label>
            <select id="exceptionStatusInput">
              <option value="to do">To Do</option>
              <option value="in progress">In Progress</option>
              <option value="in review">In Review</option>
              <option value="blocked">Blocked</option>
              <option value="complete">Complete</option>
            </select>
          </div>
          <div class="modal-actions">
            <button id="createExceptionBtn">Create</button>
            <button id="closeExceptionModalBtn" class="btn-secondary">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./taskpane.packs.js"></script>
    <script src="./taskpane.storage.js"></script>
    <script src="./taskpane.js"></script>
  </body>
</html>
