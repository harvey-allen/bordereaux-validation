<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support | Reporting Validator</title>
    <style>
      :root {
        --bg: #f5f8fc;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #dbe4ef;
        --text: #0f172a;
        --text-muted: #475569;
        --primary: #1d4ed8;
        --primary-strong: #1e40af;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px 16px 32px;
        color: var(--text);
        background: var(--bg);
      }

      .support-shell {
        max-width: 520px;
        margin: 0 auto;
        min-height: calc(100vh - 52px);
        display: flex;
        flex-direction: column;
      }

      .support-header {
        text-align: center;
        padding-top: 8px;
      }

      .support-title {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.01em;
      }

      .support-actions {
        margin-top: auto;
        display: flex;
        justify-content: center;
        padding-top: 20px;
      }

      .support-back {
        display: block;
        width: 80%;
        max-width: 220px;
        padding: 9px 10px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #ffffff;
        text-decoration: none;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }

      .support-back:hover {
        background: var(--primary-strong);
      }
    </style>
  </head>
  <body>
    <div class="support-shell">
      <div class="support-header">
        <h1 class="support-title">Support</h1>
      </div>

      <div class="support-actions">
        <a class="support-back" href="./taskpane.html">Back</a>
      </div>
    </div>
  </body>
</html>
