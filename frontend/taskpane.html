<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Validator</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Load config factory (selects appropriate config based on ENVIRONMENT) -->
    <script src="./config.factory.js"></script>
    <style>
      :root {
        --bg: #f5f8fc;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #dbe4ef;
        --text: #0f172a;
        --text-muted: #475569;
        --primary: #1d4ed8;
        --primary-strong: #1e40af;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        --panel-max-width: 960px;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px 14px 64px;
        color: var(--text);
        background: var(--bg);
      }

      .app-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px;
        box-sizing: border-box;
        width: min(100%, var(--panel-max-width));
        margin: 0 auto;
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-header img {
        width: 28px;
        height: 28px;
        object-fit: contain;
        border-radius: 6px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }

      .hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .tabs {
        display: flex;
        width: 96%;
        gap: 6px;
        margin-top: 14px;
        padding: 4px;
        border-radius: 10px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
      }

      .tab-button {
        flex: 1;
        width: auto;
        margin-top: 0;
        padding: 7px 12px;
        background: transparent;
        color: var(--text-muted);
        border: none;
        border-radius: 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .tab-button[aria-selected="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .tab-button:hover:not(:disabled) {
        color: #fff;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      input, textarea, select, button {
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 13px;
      }

      select,
      textarea,
      input {
        background: #fff;
        color: var(--text);
      }

      select:focus,
      textarea:focus,
      input:focus,
      button:focus-visible,
      .tab-button:focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.4);
        outline-offset: 1px;
      }

      textarea {
        min-height: 170px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.45;
        resize: none;
      }

      button {
        background: var(--primary);
        color: #fff;
        border: 1px solid var(--primary);
        cursor: pointer;
        font-weight: 600;
      }

      button:hover:not(:disabled) {
        background: var(--primary-strong);
      }

      button:disabled {
        background: #cbd5e1;
        border-color: #cbd5e1;
        color: #64748b;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #f8fafc;
        border-color: var(--border);
        color: #1e293b;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #eef2f7;
      }

      #generateTemplate {
        margin-top: 10px;
      }

      .coming-soon-wrap {
        position: relative;
        width: 100%;
      }

      .coming-soon-wrap::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(100% + 8px);
        background: #0f172a;
        color: #fff;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 30;
      }

      .coming-soon-wrap:hover::after {
        opacity: 1;
      }

      .tab-panel {
        display: none;
        margin-top: 12px;
      }
      .tab-panel.active { display: block; }

      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .actions-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        min-height: 34px;
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(calc(100% - 50px), 900px);
        z-index: 100;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.1);
      }

      .section-title {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
      }

      .collapsible-section {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-muted);
        padding: 8px;
      }

      .collapsible-section summary {
        list-style: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        display: flex;
        align-items: center;
      }

      .collapsible-section summary::-webkit-details-marker {
        display: none;
      }

      .collapsible-section summary::before {
        content: "▸";
        margin-right: 6px;
        transition: transform 0.15s ease;
      }

      .collapsible-section[open] summary::before {
        transform: rotate(90deg);
      }

      .collapsible-content {
        margin-top: 8px;
      }

      /* Modal styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal.active {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 14px 0 0;
      }

      .modal-content {
        background-color: var(--surface);
        padding: 20px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        box-sizing: border-box;
        width: min(calc(100vw - 28px), var(--panel-max-width));
        max-width: var(--panel-max-width);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 16px;
      }

      .close-modal {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        width: auto;
        padding: 0;
        margin: 0;
        color: var(--text-muted);
      }

      .close-modal:hover:not(:disabled) {
        background: none;
        color: var(--text-muted);
      }

      .exception-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }

      .exception-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        padding: 10px;
        background: var(--surface-muted);
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      .exception-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .exception-id {
        font-weight: 600;
        font-size: 13px;
      }

      .exception-desc {
        font-size: 12px;
        color: var(--text-muted);
      }

      .exception-status {
        display: inline-block;
        width: fit-content;
        margin-left: -2px;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        background: #e0e7ff;
        color: #3730a3;
      }

      .exception-actions {
        display: flex;
        gap: 4px;
      }

      .icon-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 6px 8px !important;
        width: auto;
        margin: 0;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
        color: var(--text);
      }

      .icon-btn:hover {
        background: var(--border);
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        margin-top: 0;
        display: block;
        margin-bottom: 4px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        margin-top: 0;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }

      .modal-actions button {
        margin-top: 0;
      }

      #exceptionSelect {
        margin-bottom: 10px;
      }

      #exceptionDescriptionInput {
        resize: none;
      }

      .launch-shell {
        min-height: calc(100vh - 28px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 32px;
        background: var(--bg);
        transform: none;
      }

      .launch-card {
        width: min(100%, 520px);
        padding: 24px 18px;
        text-align: center;
      }

      .launch-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin: 0 auto 4px;
        display: block;
      }

      .launch-title {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.01em;
      }

      .launch-subtitle {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--text-muted);
      }

      .launch-action {
        margin-top: 16px;
        width: 80%;
        max-width: 300px;
        display: inline-block;
        padding-left: 20px;
        padding-right: 20px;
      }

      .launch-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
      }

      .launch-actions .launch-action {
        margin-top: 0;
      }

      .launch-terms {
        margin: 18px 0 0;
        font-size: 11px;
        line-height: 1.4;
        color: var(--text-muted);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="launchScreen" class="launch-shell">
      <div class="launch-card">
        <img id="launchLogo" class="launch-logo" src="./assets/axios.png" alt="Axios logo" />
        <h1 id="launchTitle" class="launch-title">Loading...</h1>
        <p id="launchSubtitle" class="launch-subtitle"></p>
        <div class="launch-actions">
          <button id="launchGetStarted" class="launch-action hidden" type="button">Start</button>
          <button id="launchSupportButton" class="launch-action btn-secondary" type="button" onclick="window.location.href='./support.html'">Help</button>
        </div>
        <p class="launch-terms">Terms and Conditions</p>
      </div>
    </div>

    <div id="mainAppShell" class="app-shell hidden">
      <div class="brand-header">
        <img src="./assets/axios.png" alt="Axios logo" />
        <h2>Bordereaux Validator</h2>
      </div>
      <div class="hint">Identify data issues faster with intelligent bordereaux validation and reporting.</div>

      <div class="tabs" role="tablist" aria-label="Validator sections">
        <button id="tabConfiguration" class="tab-button" role="tab" aria-selected="true" aria-controls="panelConfiguration" title="Configure validation settings, territory, and schema options.">Configure</button>
        <button id="tabControl" class="tab-button" role="tab" aria-selected="false" aria-controls="panelControl" title="View and manage validation controls and settings.">Control</button>
        <button id="tabAnalysis" class="tab-button" role="tab" aria-selected="false" aria-controls="panelAnalysis" title="Analyse validation results and data quality trends.">Analyse</button>
      </div>

      <section id="panelConfiguration" class="tab-panel active panel-card" role="tabpanel" aria-labelledby="tabConfiguration">
        <label for="testPacks">Test Pack</label>
        <select id="testPacks">
          <option value="">Loading subscribed packs...</option>
        </select>

        <div id="territoryGroup">
          <label for="territory">Territory</label>
          <select id="territory"></select>
        </div>

        <details class="collapsible-section">
          <summary>Validation Configuration</summary>
          <div class="collapsible-content">
              <button id="estimateFieldMapping" class="btn-secondary" style="width: 100%; margin-bottom: 8px;" title="Automatically suggest field mappings using fuzzy matching.">Field Mapping Estimation</button>
              <textarea id="packConfigs"></textarea>
          </div>
        </details>

        <div class="actions-grid">
          <button id="generateTemplate" class="btn-secondary" title="Create a template workbook based on the selected schema.">Generate Template</button>
        </div>
      </section>

      <section id="panelControl" class="tab-panel panel-card" role="tabpanel" aria-labelledby="tabControl">
        <div class="actions-grid">
          <button id="runValidation" title="Run validation checks against the loaded dataset.">Validate</button>
          <button id="clearTable" class="btn-secondary" title="Clear current results, selections, and validation outputs.">Clear</button>
        </div>

        <details class="collapsible-section">
          <summary>Exception Management</summary>
          <div class="collapsible-content">
            <select id="exceptionSelect">
              <option value="">No exceptions available</option>
            </select>

            <div class="actions-grid">
              <button id="applyException" class="btn-secondary" title="Apply an existing exception to the selected issue.">Apply Exception</button>
              <button id="manageExceptions" class="btn-secondary" title="View, create, update, and track exceptions.">Manage Exceptions</button>
            </div>
          </div>
        </details>

        <details class="collapsible-section">
          <summary>Report Management</summary>
          <div class="collapsible-content">
            <div class="actions-grid">
              <button id="viewSavedVersion" class="btn-secondary" title="View detailed information and validation results.">View</button>
              <select id="savedVersions">
                <option value="">No saved reports</option>
              </select>
              <button id="saveResultsVersion" class="btn-secondary" title="Save the current validation report for future review.">Save Report</button>
              <button id="deleteResultsVersion" class="btn-secondary" title="Permanently delete the selected report.">Delete Report</button>
            </div>
          </div>
        </details>
      </section>

      <section id="panelAnalysis" class="tab-panel panel-card" role="tabpanel" aria-labelledby="tabAnalysis">
        <div class="actions-grid">
          <button id="visualiseResults" class="btn-secondary" title="Explore results through dashboards and heat maps.">Visualise</button>
          <div class="coming-soon-wrap" data-tooltip="Coming soon">
            <button id="benchmarking" class="btn-secondary" disabled>Benchmarking</button>
          </div>
          <button id="rulesEngine" class="btn-secondary" title="View validation rules and failure explanations.">Rules Engine</button>
          <button id="extractResults" class="btn-secondary" title="Export validation results and issue details.">Extract</button>
        </div>
      </section>

      <div class="status" id="status"></div>
    </div>

    <!-- Exception Management Modal -->
    <div id="exceptionModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Manage Exceptions</h3>
          <button class="close-modal" onclick="closeExceptionModal()">&times;</button>
        </div>

        <div id="exceptionListContainer" style="display: none;">
          <h4 style="margin: 0 0 12px 0; font-size: 14px;">Existing Exceptions</h4>
          <div id="exceptionList" class="exception-list"></div>
          <div id="newExceptionBtnContainer" style="display: none; margin-top: 4px;">
            <button id="newExceptionBtn" class="btn-secondary" title="Cancel editing and start creating a new exception.">New Exception</button>
          </div>
        </div>

        <div id="noExceptionsMessage" style="text-align: center; color: var(--text-muted); padding: 20px;">
          No existing exceptions
        </div>

        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
          <h4 id="exceptionFormTitle" style="margin: 0 0 12px 0; font-size: 14px;">Create New Exception</h4>
          <div class="form-group">
            <label for="exceptionIdInput">Exception ID *</label>
            <input type="text" id="exceptionIdInput" placeholder=" Example: EXC-001" />
          </div>
          <div class="form-group">
            <label for="exceptionFieldInput">Linked Field (Optional)</label>
            <select id="exceptionFieldInput">
              <option value="">Select a field...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="exceptionUmrInput">Linked UMR (Optional)</label>
            <input type="text" id="exceptionUmrInput" placeholder="Example: POL-100" />
          </div>
          <div class="form-group">
            <label for="exceptionDescriptionInput">Description *</label>
            <textarea id="exceptionDescriptionInput" placeholder="Describe the exception..." style="min-height: 80px;"></textarea>
          </div>
          <div class="form-group">
            <label for="exceptionStatusInput">Status</label>
            <select id="exceptionStatusInput">
              <option value="to do">To Do</option>
              <option value="in progress">In Progress</option>
              <option value="in review">In Review</option>
              <option value="blocked">Blocked</option>
              <option value="complete">Complete</option>
            </select>
          </div>
          <div class="modal-actions">
            <button id="createExceptionBtn" title="Create a new exception record.">Create</button>
            <button id="closeExceptionModalBtn" class="btn-secondary">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./taskpane.packs.js"></script>
    <script src="./taskpane.storage.js"></script>
    <script src="./modules/taskpane/address.js"></script>
    <script src="./modules/taskpane/errors.js"></script>
    <script src="./modules/taskpane/debug.js"></script>
    <script src="./modules/taskpane/sheet-range.js"></script>
    <script src="./modules/taskpane/scope.js"></script>
    <script src="./modules/taskpane/tagged-cells.js"></script>
    <script src="./modules/taskpane/versions.js"></script>
    <script src="./modules/taskpane/exception-helpers.js"></script>
    <script src="./modules/taskpane/exception-actions.js"></script>
    <script src="./modules/taskpane/version-actions.js"></script>
    <script src="./modules/taskpane/validation-actions.js"></script>
    <script src="./modules/taskpane/rules-engine.js"></script>
    <script src="./modules/taskpane/extraction.js"></script>
    <script src="./modules/taskpane/visualisation.js"></script>
    <script src="./taskpane.js"></script>
  </body>
</html>
